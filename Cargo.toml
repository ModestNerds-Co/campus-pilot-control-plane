[package]
name = "campus-pilot-control-plane"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "pkcs8", "pem"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
hmac = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde", "wasm-bindgen"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["js", "serde", "v4"] }
wasm-bindgen = "=0.2.125"
worker = { version = "0.8.5", features = ["d1"] }

[dev-dependencies]
hex = "0.4.3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
